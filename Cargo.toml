[package]
name = "s3-fleet"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fleet of SSH hosts kept in one S3 object: pinned host keys, labels, discovery over DNS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ticpu/s3-fleet"
readme = "README.md"
keywords = ["ssh", "s3", "fleet", "known-hosts", "inventory"]
categories = ["command-line-utilities", "network-programming"]
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:tracing-subscriber",
    "dep:rpassword",
    "dep:shlex",
    "tokio/rt",
    "tokio/macros",
]

[dependencies]
aws-credential-types = "1.3"
aws-sigv4 = "1.6"
aws-smithy-runtime-api = "1.19"
etcetera = "0.11"
hickory-resolver = "0.26"
percent-encoding = "2.3"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "fs"] }
tracing = "0.1"

clap = { version = "4.6", features = ["derive", "env"], optional = true }
clap_complete = { version = "4.6", features = ["unstable-dynamic"], optional = true }
rpassword = { version = "7.5", optional = true }
shlex = { version = "2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[[bin]]
name = "s3-fleet"
required-features = ["cli"]
